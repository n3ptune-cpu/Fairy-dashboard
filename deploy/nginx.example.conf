# /etc/nginx/conf.d/fairy.conf - nginx in its own container in front of Fairy, behind Cloudflare (proxied).
#
#   Cloudflare -> (MikroTik dst-nat :443) -> nginx 10.0.0.5 -> Fairy 10.0.0.20:8080 (config.yaml listen:)
#
# Fairy config.yaml:  listen: 10.0.0.20:8080   trusted_proxies: ["10.0.0.5/32"]
#                     public_url: https://panel.example.com
# Security headers (CSP, HSTS, X-Frame-Options, ...) are set by Fairy: do not add or override them here.
# Use nginx >= 1.30.6 / 1.31.7. Replace panel.example.com, the addresses and the certificate paths.

# --- real client IP: only from Cloudflare, taken from CF-Connecting-IP -------------------------------------
# Keep this list current: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;   # $remote_addr = the visitor (only when the peer is a Cloudflare address)

# --- rate limits (per real client IP) ----------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=fairy_auth:10m rate=10r/m;   # sign-in, step-up and approval round trips (one per approved action)
limit_req_zone  $binary_remote_addr zone=fairy_api:10m  rate=20r/s;   # API (the UI polls a few endpoints)
limit_conn_zone $binary_remote_addr zone=fairy_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream fairy {
    server 10.0.0.20:8080;
    keepalive 16;
}

# Anything that is not panel.example.com (scanners, other Host / SNI): close the connection.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/nginx/tls/panel.example.com.crt;   # Cloudflare origin certificate
    ssl_certificate_key /etc/nginx/tls/panel.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # Only Cloudflare may connect (Authenticated Origin Pulls with a zone-specific certificate):
    ssl_client_certificate /etc/nginx/tls/cloudflare-aop-zone.pem;
    ssl_verify_client on;

    server_tokens off;
    client_max_body_size 128k;          # Fairy accepts at most 64 KiB JSON bodies
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    limit_conn fairy_conn 20;           # one browser needs ~4 (page, SSE stream, a few fetches)

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: Fairy (trusted_proxies = this nginx) then sees exactly the real client IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    location / {
        proxy_pass http://fairy;
    }

    location /auth/ {
        limit_req zone=fairy_auth burst=10 nodelay;
        proxy_pass http://fairy;
    }

    location /api/ {
        limit_req zone=fairy_api burst=40 nodelay;
        proxy_pass http://fairy;
    }

    # Server-Sent Events: no buffering, long reads (Fairy sends a keepalive every 15 s).
    location = /api/stream {
        limit_req zone=fairy_api burst=40 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://fairy;
    }

    # Background image upload: Fairy accepts at most 8 MiB.
    location = /api/settings/background {
        limit_req zone=fairy_api burst=5 nodelay;
        client_max_body_size 9m;
        proxy_request_buffering on;
        proxy_pass http://fairy;
    }

    # Sign-in wallpaper upload (admins, Settings page): the same 8 MiB.
    location = /api/admin/signin-wallpaper {
        limit_req zone=fairy_api burst=5 nodelay;
        client_max_body_size 9m;
        proxy_request_buffering on;
        proxy_pass http://fairy;
    }
}
