# /etc/fairy/config.yaml  (non-secret settings; secrets live in /etc/fairy/fairy.env, referenced by NAME here)
public_url: https://panel.example.com     # behind nginx; used for the OIDC redirect URI (<public_url>/auth/callback)
listen: 127.0.0.1:8080                    # nginx in another container: this LXC's LAN IP, e.g. 10.0.0.20:8080,
                                          # firewalled so only nginx can reach it (--listen / FAIRY_LISTEN override)
request_timeout: 4                        # seconds per request (each source also gets a timeout below its interval)
offline_after: 60                         # failing for longer than this => "offline" (before that: "stale")
session_max_age: 604800                   # 7 d absolute; group membership is re-checked at each login
session_idle_timeout: 43200               # 12 h without activity => sign in again
step_up_window_s: 300                     # control actions need a Pocket ID sign-in from the last 5 min
step_up_prompt_login: true                # also send prompt=login on step-up (max_age=0 is always sent).
                                          # Pocket ID must put auth_time in the ID token, or step-up fails.
enable_docs: false                        # /docs + /api/openapi.json (login required)
data_dir: /var/lib/fairy                  # state.json, sessions.json, tokens.json, users.json, settings, uploads, health.json
audit_log: /var/lib/fairy/audit.log       # append-only JSON lines (each line at most 8 KiB)
audit_max_mb: 100                         # rotate audit.log -> audit.log.1 ... at this size; -1 = never (use logrotate)
audit_keep: 5                             # rotated files kept (the oldest is deleted)
control_rate_per_min: 6
login_rate_per_min: 20                    # per client IP (per user for a signed-in step-up)
# X-Forwarded-For is believed only from these (rate limits + audit IPs). nginx in its own container: its address,
# e.g. ["10.0.0.5/32"], with nginx setting X-Forwarded-For to the real client (deploy/nginx.example.conf).
trusted_proxies: ["127.0.0.1/32", "::1/128"]
panel_hosts: []                           # system ids the panel itself runs on (power menu warns), e.g. [lxc-110]
boost_while_viewing: true                 # 1 s polling while a host's page is open (30 s grace)
intervals: {agent: 1, proxmox: 2, ups: 2, history: 5, stream: 1}
# Releases (Updates page, `fairy update`). The panel asks GitHub for the newest Fairy-agent release at most every
# 10 min while an admin has the Updates page open; without internet access set check_latest: false.
# updates: {check_latest: true, agent_repo: n3ptune-cpu/Fairy-agent, panel_repo: n3ptune-cpu/Fairy-dashboard}
# branding:
#   logo: /etc/fairy/logo.png             # your own logo instead of the built-in one (sidebar, sign-in page, favicon):
#                                         # PNG, JPEG, WebP or GIF, at most 1 MiB, no SVG. Read once at start; a bad
#                                         # file only logs a warning. Served at /branding/logo (no sign-in needed).

oidc:
  issuer: https://id.example.com          # Pocket ID; discovery = <issuer>/.well-known/openid-configuration
  client_id: 00000000-0000-0000-0000-000000000000   # secret (if not a public client): FAIRY_OIDC_CLIENT_SECRET
  scopes: [openid, profile, email, groups]
  groups_claim: groups
  # Pocket ID only decides who may SIGN IN (allowed_groups / allowed_emails). What people see and may do is set
  # in the panel: Users page (admins), or `fairy admin users ...` on the server.
  allowed_groups: [homelab]
  allowed_emails: []                      # only matched when Pocket ID says email_verified: true
  # Bootstrap: ONLY while users.json has no admin at all (fresh install / upgrade), the first real sign-in of
  # someone in these groups, or with one of these VERIFIED emails, makes them admin. Once there is an admin,
  # everyone else waits for access and the Users page decides (leaving the group changes nothing). Someone an
  # admin removed is never bootstrapped again. After your first sign-in you can empty both lists.
  control_groups: [homelab-admins]
  bootstrap_admins: []                    # e.g. [neptune@example.com]; recommended: [] once you are admin

proxmox:
  - id: teyvat
    id_prefix: ""                         # keep ids unprefixed for the main cluster
    cluster_name: NSX-TEYVAT
    site: Neptune                         # optional default site of its nodes and guests (Users page overrides)
    urls: [https://pve1.lan:8006, https://pve2.lan:8006]   # tried in order (failover)
    token_id: fairy@pve!panel             # read-only token; secret: FAIRY_PROXMOX_TOKEN_SECRET (or token_secret_env)
    verify_tls: true
    ca_file: /etc/fairy/pve-root-ca.pem
    # Optional separate token with only VM.PowerMgmt (role "FairyPower") -> guest start/shutdown/reboot/stop
    # power_token_id: fairy@pve!power
    # power_token_secret_env: FAIRY_PROXMOX_POWER_TOKEN
    # node_power: false                   # nodes via Sys.PowerMgmt when no agent with power control runs on them

agents:
  - id: nsx-cyrene
    name: NSX-CYRENE
    url: http://100.64.0.10:9101
    token_env: AGENT_TOKEN_NSX_CYRENE     # one token per machine (>= 24 chars)
    group: Neptune
    owner: neptune
    site: Neptune                         # optional default site: viewers of "Neptune" see this host
    tags: [server]
    # fan_control: {vendor: supermicro, control_token_env: AGENT_CONTROL_TOKEN_NSX_CYRENE}
    # power_control: true                 # also needs power_control.enabled in the agent's config.yaml
    # control_token_env: AGENT_CONTROL_TOKEN_NSX_CYRENE   # for power_control / wol_relay / self_update without fan_control
    # self_update: true                   # Update button on the Updates page; also needs self_update.enabled in the agent's config.yaml
  # - {id: kachina-agent, url: "http://100.64.0.5:9101", token_env: AGENT_TOKEN_KACHINA, node: NSX-KACHINA}

systems: []
  # - {id: qemu-100, dwservice_url: "https://www.dwservice.net/...", tags: [gaming], site: Straw}
  # - {id: nsx-cyrene, wol: {mac: "3c:ec:ef:00:11:22", relay: kachina-agent, broadcast: 192.168.10.255}}
  # a machine with two network cards (Wake sends a packet to each):
  # - {id: straw-msi-5600x, wol: {macs: ["d4:0d:ab:14:16:36", "04:7c:16:aa:bb:cc"], relay: straw-asus-i7-agent}}

# Power sources and UPSes follow the hosts they are attached to (system: / powers:); one without a host gets
# its site on the Users page. Anything without a site is visible to admins only.
power_sources: []
  # - {id: plug-cyrene, type: tuya, device_id: bf0123456789abcdef, ip: 192.168.1.60, local_key_env: TUYA_KEY_PLUG, version: "3.4", system: nsx-cyrene}
  # - {id: plug-desk, type: shelly, url: "http://192.168.1.61", password_env: SHELLY_PW}
  # - {id: tasmota-1, type: tasmota, url: "http://192.168.1.62", password_env: TASMOTA_PW}
  # BMCs: keep verify_tls (the default, true) and give the BMC's certificate or CA in ca_file; use a read-only
  # BMC account. verify_tls: false sends the BMC password to anyone who can intercept that network.
  # - {id: idrac, type: redfish, url: "https://192.168.1.5", username: fairy-ro, password_env: IDRAC_PW, ca_file: /etc/fairy/idrac-ca.pem}
  # - {id: ups-power, type: nut, host: 192.168.1.10, ups: ups}

ups: []
  # - {id: rack, host: 192.168.1.10, username: monuser, password_env: NUT_PASSWORD, powers: [node-pve1, node-pve2]}
