# /etc/tmpfiles.d/fairy-agent.conf  (optional; apply now with: systemd-tmpfiles --create /etc/tmpfiles.d/fairy-agent.conf)
# CPU package power: the RAPL energy counters are root-only since CVE-2020-8694 (Platypus). This lets the
# fairy-agent group read them; leave it out if you prefer the panel without CPU watts.
z /sys/class/powercap/intel-rapl:*/energy_uj 0440 root fairy-agent -
